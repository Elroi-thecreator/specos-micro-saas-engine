id: DEV-002
type: development
title: Enterprise-Grade UI/UX Design System
domain: frontend-design
status: approved
version: "1.0.0"
rule: |
  All user interfaces across the platform MUST adhere to the Enterprise Design System:
  Linear/Vercel obsidian aesthetic (#09090b background), subtle neutral zinc borders (zinc-800/80),
  refined typography with crisp tracking, tabular numeric fonts for financial/token metrics,
  cohesive badge status indicators, and sleek micro-interactions.
do:
  - Use deep neutral obsidian/zinc background (#09090b / #0c0e14) with subtle radial mesh glow.
  - Implement 1px refined border highlights with hover transitions (border-zinc-800 to border-zinc-700).
  - Use monospace fonts (font-mono) for all IDs, tokens, timestamps, and code artifacts.
  - Design unified status indicators (green for healthy/low risk, amber for warnings, red for high risk/critical).
  - Support high-contrast dark theme with full RTL adaptability for Arabic locale.
dont:
  - Never use harsh, saturated full-color background cards.
  - Never use plain browser dropdowns with unstyled borders.
  - Never render unaligned metric grids or inconsistent badge dimensions.
reason: |
  Enterprise customers and hackathon judges expect a modern, polished product feel comparable
  to Stripe, Linear, or Vercel. Professional aesthetic builds immediate credibility.
related_items:
